name: Snyk Full Container Vulnerability Report

on:
  workflow_dispatch:
    inputs:

      image_uri:
        description: "Full ECR Docker image URI"
        required: true
        type: string

      aws_region:
        description: "AWS Region"
        required: true
        default: "ap-south-1"
        type: string


permissions:
  contents: read


jobs:

  snyk-full-report:

    name: Snyk Full Container Report

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. DISPLAY PARAMETERS
      # ==========================================================

      - name: Display Scan Parameters
        run: |

          echo "============================================================"
          echo "          SNYK FULL CONTAINER VULNERABILITY REPORT"
          echo "============================================================"

          echo ""
          echo "Image  : ${{ inputs.image_uri }}"
          echo "Region : ${{ inputs.aws_region }}"
          echo ""

          echo "============================================================"


      # ==========================================================
      # 2. CHECKOUT
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # 3. AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}


      # ==========================================================
      # 4. VERIFY AWS
      # ==========================================================

      - name: Verify AWS Identity
        run: |

          aws sts get-caller-identity


      # ==========================================================
      # 5. PARSE IMAGE
      # ==========================================================

      - name: Parse ECR Image
        shell: bash
        run: |

          set -e

          IMAGE_URI="${{ inputs.image_uri }}"

          REGISTRY=$(echo "$IMAGE_URI" | cut -d'/' -f1)

          IMAGE_PATH=$(echo "$IMAGE_URI" | cut -d'/' -f2-)

          REPOSITORY=$(echo "$IMAGE_PATH" | cut -d':' -f1)

          TAG=$(echo "$IMAGE_PATH" | cut -d':' -f2-)

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "ECR_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

          echo "ECR_REPOSITORY=$REPOSITORY" >> "$GITHUB_ENV"

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"


      # ==========================================================
      # 6. ECR LOGIN
      # ==========================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # 7. VERIFY IMAGE
      # ==========================================================

      - name: Verify ECR Image
        run: |

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "${{ inputs.aws_region }}"

          echo ""
          echo "Image exists in ECR."


      # ==========================================================
      # 8. PULL IMAGE
      # ==========================================================

      - name: Pull Docker Image
        run: |

          echo "Pulling:"
          echo "$IMAGE_URI"

          docker pull "$IMAGE_URI"

          echo ""
          echo "Image pulled successfully."


      # ==========================================================
      # 9. IMAGE INFORMATION
      # ==========================================================

      - name: Display Docker Image Information
        run: |

          echo "============================================================"
          echo "Docker Image Information"
          echo "============================================================"

          docker image inspect "$IMAGE_URI" | jq '.[0] | {
            Id,
            Created,
            Architecture,
            Os,
            Size,
            RepoTags
          }'


      # ==========================================================
      # 10. INSTALL SNYK
      # ==========================================================

      - name: Install Snyk CLI
        run: |

          npm install --global snyk

          echo ""
          echo "Snyk version:"
          snyk --version


      # ==========================================================
      # 11. VERIFY TOKEN
      # ==========================================================

      - name: Verify Snyk Token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN is not configured."
            exit 1
          fi

          echo "SNYK_TOKEN is configured."


      # ==========================================================
      # 12. FULL SNYK SCAN
      #
      # NO SEVERITY FILTER
      #
      # ALL vulnerabilities are collected.
      #
      # NO SECURITY GATE.
      # ==========================================================

      - name: Run Full Snyk Container Scan
        id: snyk_scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          echo "============================================================"
          echo "              SNYK FULL CONTAINER SCAN"
          echo "============================================================"

          echo ""
          echo "Image:"
          echo "$IMAGE_URI"

          echo ""
          echo "Scanning ALL severities..."

          set +e

          snyk container test "$IMAGE_URI" \
            --json-file-output=snyk-full-report.json

          SNYK_EXIT_CODE=$?

          set -e

          echo "SNYK_EXIT_CODE=$SNYK_EXIT_CODE" >> "$GITHUB_ENV"

          echo ""
          echo "Snyk exit code: $SNYK_EXIT_CODE"

          echo ""
          echo "Scan completed."

          # IMPORTANT:
          # Do not fail the pipeline because vulnerabilities
          # were found.
          #
          # This workflow is REPORT ONLY.


      # ==========================================================
      # 13. GENERATE REPORT
      # ==========================================================

      - name: Generate Full Vulnerability Report
        if: always()
        run: |

          python3 <<'PY'

          import json
          import html
          from datetime import datetime


          INPUT = "snyk-full-report.json"

          TXT = "snyk-full-report.txt"

          HTML = "snyk-full-report.html"


          try:

              with open(INPUT, "r") as f:
                  data = json.load(f)

          except Exception as e:

              message = (
                  "Unable to read Snyk report.\n\n"
                  f"Error: {e}\n"
              )

              with open(TXT, "w") as f:
                  f.write(message)

              with open(HTML, "w") as f:
                  f.write(
                      "<html><body>"
                      "<h1>Snyk Container Report</h1>"
                      f"<p>{html.escape(message)}</p>"
                      "</body></html>"
                  )

              raise SystemExit(0)


          vulnerabilities = data.get(
              "vulnerabilities",
              []
          )


          counts = {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
              "unknown": 0
          }


          for vuln in vulnerabilities:

              severity = str(
                  vuln.get(
                      "severity",
                      "unknown"
                  )
              ).lower()

              if severity in counts:
                  counts[severity] += 1
              else:
                  counts["unknown"] += 1


          image = "${{ inputs.image_uri }}"

          scan_time = datetime.utcnow().strftime(
              "%Y-%m-%d %H:%M:%S UTC"
          )


          # ======================================================
          # TEXT
          # ======================================================

          with open(TXT, "w") as out:

              out.write("=" * 100 + "\n")

              out.write(
                  "                 SNYK FULL CONTAINER VULNERABILITY REPORT\n"
              )

              out.write("=" * 100 + "\n\n")


              out.write("SCAN INFORMATION\n")

              out.write("-" * 100 + "\n")

              out.write(
                  "Scanner       : Snyk Container\n"
              )

              out.write(
                  f"Image         : {image}\n"
              )

              out.write(
                  f"Scan Time     : {scan_time}\n"
              )

              out.write(
                  f"Total Findings: {len(vulnerabilities)}\n"
              )

              out.write("\n")


              out.write("SEVERITY SUMMARY\n")

              out.write("-" * 100 + "\n")

              out.write(
                  f"Critical : {counts['critical']}\n"
              )

              out.write(
                  f"High     : {counts['high']}\n"
              )

              out.write(
                  f"Medium   : {counts['medium']}\n"
              )

              out.write(
                  f"Low      : {counts['low']}\n"
              )

              out.write(
                  f"Unknown  : {counts['unknown']}\n"
              )

              out.write("\n")


              out.write("VULNERABILITY DETAILS\n")

              out.write("-" * 100 + "\n\n")


              for index, vuln in enumerate(
                  vulnerabilities,
                  1
              ):

                  severity = str(
                      vuln.get(
                          "severity",
                          "unknown"
                      )
                  ).upper()


                  vuln_id = vuln.get(
                      "id",
                      "N/A"
                  )

                  title = vuln.get(
                      "title",
                      "N/A"
                  )

                  package = vuln.get(
                      "packageName",
                      "N/A"
                  )

                  version = vuln.get(
                      "version",
                      "N/A"
                  )

                  fixed = vuln.get(
                      "fixedIn",
                      "N/A"
                  )

                  cvss = (
                      vuln.get("CVSSv3")
                      or vuln.get("CVSSv4")
                      or vuln.get("cvssScore")
                      or vuln.get("cvss")
                      or "N/A"
                  )


                  out.write(
                      f"[{index}] {severity}\n"
                  )

                  out.write(
                      f"    Vulnerability ID : {vuln_id}\n"
                  )

                  out.write(
                      f"    Title             : {title}\n"
                  )

                  out.write(
                      f"    Package           : {package}\n"
                  )

                  out.write(
                      f"    Installed Version : {version}\n"
                  )

                  out.write(
                      f"    Fixed Version     : {fixed}\n"
                  )

                  out.write(
                      f"    CVSS              : {cvss}\n"
                  )


                  dependency = vuln.get(
                      "from"
                  )

                  if dependency:

                      out.write(
                          f"    Dependency Path   : "
                          f"{dependency}\n"
                      )


                  docker_instruction = vuln.get(
                      "dockerfileInstruction"
                  )

                  if docker_instruction:

                      out.write(
                          f"    Dockerfile        : "
                          f"{docker_instruction}\n"
                      )


                  out.write("\n")

                  out.write(
                      "-" * 100 + "\n\n"
                  )


          # ======================================================
          # HTML
          # ======================================================

          def esc(value):

              return html.escape(
                  str(value)
              )


          rows = []


          for index, vuln in enumerate(
              vulnerabilities,
              1
          ):

              severity = str(
                  vuln.get(
                      "severity",
                      "unknown"
                  )
              ).upper()


              vuln_id = vuln.get(
                  "id",
                  "N/A"
              )

              title = vuln.get(
                  "title",
                  "N/A"
              )

              package = vuln.get(
                  "packageName",
                  "N/A"
              )

              version = vuln.get(
                  "version",
                  "N/A"
              )

              fixed = vuln.get(
                  "fixedIn",
                  "N/A"
              )

              cvss = (
                  vuln.get("CVSSv3")
                  or vuln.get("CVSSv4")
                  or vuln.get("cvssScore")
                  or vuln.get("cvss")
                  or "N/A"
              )


              dependency = vuln.get(
                  "from",
                  "N/A"
              )


              docker_instruction = vuln.get(
                  "dockerfileInstruction",
                  "N/A"
              )


              rows.append(
                  f"""
                  <tr>
                    <td>{index}</td>
                    <td><b>{esc(severity)}</b></td>
                    <td>{esc(vuln_id)}</td>
                    <td>{esc(title)}</td>
                    <td>{esc(package)}</td>
                    <td>{esc(version)}</td>
                    <td>{esc(fixed)}</td>
                    <td>{esc(cvss)}</td>
                    <td>{esc(dependency)}</td>
                    <td>{esc(docker_instruction)}</td>
                  </tr>
                  """
              )


          report = f"""

          <!DOCTYPE html>

          <html>

          <head>

          <meta charset="UTF-8">

          <title>
          Snyk Full Container Vulnerability Report
          </title>

          <style>

          body {{
              font-family: Arial, sans-serif;
              margin: 30px;
              background: #f4f6f8;
              color: #222;
          }}

          .header {{
              background: #172033;
              color: white;
              padding: 25px;
              border-radius: 10px;
          }}

          .section {{
              background: white;
              padding: 20px;
              margin-top: 20px;
              border-radius: 10px;
          }}

          table {{
              width: 100%;
              border-collapse: collapse;
          }}

          th {{
              background: #e5e7eb;
              padding: 10px;
              border: 1px solid #ccc;
          }}

          td {{
              padding: 9px;
              border: 1px solid #ddd;
              vertical-align: top;
          }}

          </style>

          </head>

          <body>


          <div class="header">

          <h1>
          Snyk Full Container Vulnerability Report
          </h1>

          <p>
          <b>Scanner:</b> Snyk Container
          </p>

          <p>
          <b>Image:</b> {esc(image)}
          </p>

          <p>
          <b>Scan Time:</b> {esc(scan_time)}
          </p>

          </div>


          <div class="section">

          <h2>Severity Summary</h2>

          <table>

          <tr>
          <th>Severity</th>
          <th>Count</th>
          </tr>

          <tr>
          <td>Critical</td>
          <td>{counts["critical"]}</td>
          </tr>

          <tr>
          <td>High</td>
          <td>{counts["high"]}</td>
          </tr>

          <tr>
          <td>Medium</td>
          <td>{counts["medium"]}</td>
          </tr>

          <tr>
          <td>Low</td>
          <td>{counts["low"]}</td>
          </tr>

          <tr>
          <td>Unknown</td>
          <td>{counts["unknown"]}</td>
          </tr>

          </table>

          </div>


          <div class="section">

          <h2>Vulnerability Details</h2>

          <table>

          <tr>

          <th>#</th>
          <th>Severity</th>
          <th>ID</th>
          <th>Title</th>
          <th>Package</th>
          <th>Installed</th>
          <th>Fixed</th>
          <th>CVSS</th>
          <th>Dependency Path</th>
          <th>Dockerfile / Layer</th>

          </tr>

          {''.join(rows)}

          </table>

          </div>


          </body>

          </html>

          """


          with open(
              HTML,
              "w"
          ) as f:

              f.write(report)


          print("Reports generated successfully.")

          PY


      # ==========================================================
      # 14. DISPLAY REPORT
      # ==========================================================

      - name: Display Full Report
        if: always()
        run: |

          echo ""
          echo "============================================================"
          echo "              SNYK FULL VULNERABILITY REPORT"
          echo "============================================================"

          if [ -f snyk-full-report.txt ]; then
            cat snyk-full-report.txt
          fi


      # ==========================================================
      # 15. UPLOAD REPORT
      # ==========================================================

      - name: Upload Snyk Full Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-full-container-report
          path: |
            snyk-full-report.json
            snyk-full-report.txt
            snyk-full-report.html
          if-no-files-found: warn
          retention-days: 30


      # ==========================================================
      # 16. COMPLETE
      #
      # NO SECURITY GATE
      # NO exit 1
      # ==========================================================

      - name: Scan Completed
        if: always()
        run: |

          echo ""
          echo "============================================================"
          echo "           SNYK FULL REPORT GENERATION COMPLETE"
          echo "============================================================"

          echo ""
          echo "Image:"
          echo "$IMAGE_URI"

          echo ""
          echo "Reports:"
          echo "  - snyk-full-report.json"
          echo "  - snyk-full-report.txt"
          echo "  - snyk-full-report.html"

          echo ""
          echo "The reports have been uploaded as GitHub Actions artifacts."

          echo ""
          echo "============================================================"