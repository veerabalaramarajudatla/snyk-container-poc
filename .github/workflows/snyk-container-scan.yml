name: Snyk Container Vulnerability Scan

# ============================================================
# MANUAL TRIGGER ONLY
# ============================================================
on:
  workflow_dispatch:
    inputs:

      image_uri:
        description: >
          Full ECR Docker image URI.
          Example:
          123456789012.dkr.ecr.ap-south-1.amazonaws.com/my-app:uat-123
        required: true
        type: string

      aws_region:
        description: "AWS Region where the ECR repository exists"
        required: true
        default: "ap-south-1"
        type: string

      severity_threshold:
        description: >
          Severity threshold for PASS/FAIL decision.
          The report will still contain ALL vulnerabilities.
        required: true
        default: "high"
        type: choice
        options:
          - low
          - medium
          - high
          - critical

permissions:
  contents: read

jobs:

  snyk-container-scan:

    name: Snyk Container Vulnerability Scan

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. DISPLAY INPUT PARAMETERS
      # ========================================================
      - name: Display Scan Parameters
        shell: bash
        run: |

          echo "======================================================================"
          echo "              SNYK CONTAINER VULNERABILITY SCAN"
          echo "======================================================================"
          echo ""
          echo "Scan Configuration"
          echo "----------------------------------------------------------------------"
          echo "Docker Image      : ${{ inputs.image_uri }}"
          echo "AWS Region        : ${{ inputs.aws_region }}"
          echo "Security Threshold: ${{ inputs.severity_threshold }}"
          echo ""
          echo "GitHub Repository : $GITHUB_REPOSITORY"
          echo "Workflow Run ID   : $GITHUB_RUN_ID"
          echo "Triggered By      : $GITHUB_ACTOR"
          echo "Run Number        : $GITHUB_RUN_NUMBER"
          echo ""
          echo "======================================================================"


      # ========================================================
      # 2. CHECKOUT REPOSITORY
      # ========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log Repository Details
        shell: bash
        run: |

          echo "======================================================================"
          echo "                      SOURCE DETAILS"
          echo "======================================================================"
          echo ""
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF_NAME"
          echo "Commit     : $GITHUB_SHA"
          echo ""
          echo "Repository checkout completed."
          echo ""
          echo "======================================================================"


      # ========================================================
      # 3. CONFIGURE AWS CREDENTIALS
      #
      # Uses GitHub OIDC.
      # No AWS access key/secret required.
      # ========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}


      # ========================================================
      # 4. VERIFY AWS IDENTITY
      # ========================================================
      - name: Verify AWS Identity
        shell: bash
        run: |

          echo "======================================================================"
          echo "                       AWS IDENTITY"
          echo "======================================================================"
          echo ""

          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "${{ inputs.aws_region }}"

          echo ""
          echo "======================================================================"


      # ========================================================
      # 5. PARSE ECR IMAGE INFORMATION
      # ========================================================
      - name: Parse ECR Image
        shell: bash
        run: |

          set -e

          IMAGE_URI="${{ inputs.image_uri }}"

          echo "======================================================================"
          echo "                     ECR IMAGE DETAILS"
          echo "======================================================================"
          echo ""

          echo "Full Image URI:"
          echo "$IMAGE_URI"
          echo ""

          # Registry
          REGISTRY=$(echo "$IMAGE_URI" | cut -d'/' -f1)

          # Repository + tag
          IMAGE_PATH=$(echo "$IMAGE_URI" | cut -d'/' -f2-)

          # Repository
          REPOSITORY=$(echo "$IMAGE_PATH" | cut -d':' -f1)

          # Tag
          TAG=$(echo "$IMAGE_PATH" | cut -d':' -f2-)

          echo "ECR Registry : $REGISTRY"
          echo "Repository   : $REPOSITORY"
          echo "Image Tag    : $TAG"
          echo ""

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

          echo "======================================================================"


      # ========================================================
      # 6. LOGIN TO ECR
      # ========================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Confirm ECR Login
        shell: bash
        run: |

          echo "======================================================================"
          echo "                     ECR AUTHENTICATION"
          echo "======================================================================"
          echo ""
          echo "Registry:"
          echo "$ECR_REGISTRY"
          echo ""
          echo "ECR authentication successful."
          echo ""
          echo "======================================================================"


      # ========================================================
      # 7. VERIFY IMAGE EXISTS
      # ========================================================
      - name: Verify ECR Image
        shell: bash
        run: |

          set -e

          echo "======================================================================"
          echo "                    VERIFY ECR IMAGE"
          echo "======================================================================"
          echo ""
          echo "Repository:"
          echo "$ECR_REPOSITORY"
          echo ""
          echo "Tag:"
          echo "$IMAGE_TAG"
          echo ""

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "${{ inputs.aws_region }}"

          echo ""
          echo "Image exists in ECR."
          echo ""
          echo "======================================================================"


      # ========================================================
      # 8. PULL DOCKER IMAGE
      # ========================================================
      - name: Pull Docker Image
        shell: bash
        run: |

          set -e

          echo "======================================================================"
          echo "                     DOCKER IMAGE PULL"
          echo "======================================================================"
          echo ""
          echo "Pulling:"
          echo "$IMAGE_URI"
          echo ""

          docker pull "$IMAGE_URI"

          echo ""
          echo "Docker image successfully pulled."
          echo ""
          echo "======================================================================"


      # ========================================================
      # 9. DISPLAY DOCKER IMAGE DETAILS
      # ========================================================
      - name: Display Docker Image Details
        shell: bash
        run: |

          echo "======================================================================"
          echo "                   DOCKER IMAGE INFORMATION"
          echo "======================================================================"
          echo ""

          echo "Docker Images:"
          docker images

          echo ""
          echo "Image Metadata:"
          docker image inspect "$IMAGE_URI" | jq '.[0] | {
            Id,
            Created,
            Architecture,
            Os,
            Size,
            RepoTags
          }'

          echo ""
          echo "======================================================================"


      # ========================================================
      # 10. INSTALL SNYK CLI
      # ========================================================
      - name: Install Snyk CLI
        shell: bash
        run: |

          set -e

          echo "======================================================================"
          echo "                       SNYK CLI"
          echo "======================================================================"
          echo ""

          npm install --global snyk

          echo ""
          echo "Installed Snyk version:"
          snyk --version

          echo ""
          echo "Snyk CLI installation completed."
          echo ""
          echo "======================================================================"


      # ========================================================
      # 11. VERIFY SNYK TOKEN
      # ========================================================
      - name: Verify Snyk Configuration
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          echo "======================================================================"
          echo "                    SNYK AUTHENTICATION"
          echo "======================================================================"
          echo ""

          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN GitHub secret is not configured."
            exit 1
          fi

          echo "SNYK_TOKEN is available."
          echo "Token value will not be displayed."
          echo ""

          echo "Snyk authentication configuration is ready."
          echo ""
          echo "======================================================================"


      # ========================================================
      # 12. RUN SNYK CONTAINER SCAN
      #
      # IMPORTANT:
      #
      # We DO NOT use --severity-threshold here.
      #
      # Why?
      #
      # We want the report to contain ALL vulnerabilities:
      # Critical
      # High
      # Medium
      # Low
      #
      # The severity threshold is applied separately later
      # as our security gate.
      # ========================================================
      - name: Run Snyk Container Scan
        id: snyk_scan
        continue-on-error: true
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |

          echo "======================================================================"
          echo "                 SNYK CONTAINER VULNERABILITY SCAN"
          echo "======================================================================"
          echo ""
          echo "Scanner            : Snyk Container"
          echo "Image              : $IMAGE_URI"
          echo "Severity Threshold : ${{ inputs.severity_threshold }}"
          echo ""
          echo "IMPORTANT:"
          echo "The scan will collect ALL vulnerabilities."
          echo "The severity threshold is applied only to the security gate."
          echo ""
          echo "Starting Snyk scan..."
          echo ""

          snyk container test "$IMAGE_URI" \
            --json-file-output=snyk-container-report.json

          SNYK_EXIT_CODE=$?

          echo ""
          echo "----------------------------------------------------------------------"
          echo "Snyk CLI Exit Code: $SNYK_EXIT_CODE"
          echo "----------------------------------------------------------------------"
          echo ""

          echo "SNYK_EXIT_CODE=$SNYK_EXIT_CODE" >> "$GITHUB_ENV"

          if [ "$SNYK_EXIT_CODE" -eq 0 ]; then
            echo "Snyk did not identify vulnerabilities."
          elif [ "$SNYK_EXIT_CODE" -eq 1 ]; then
            echo "Snyk identified vulnerabilities."
            echo "This is NOT yet the final PASS/FAIL decision."
            echo "The configured severity policy will be evaluated separately."
          else
            echo "Snyk encountered a scan error."
          fi

          echo ""
          echo "======================================================================"


      # ========================================================
      # 13. CHECK THAT REPORT EXISTS
      # ========================================================
      - name: Validate Snyk Report
        if: always()
        shell: bash
        run: |

          echo "======================================================================"
          echo "                    SNYK REPORT VALIDATION"
          echo "======================================================================"
          echo ""

          if [ -f "snyk-container-report.json" ]; then

            echo "Snyk JSON report generated successfully."
            echo ""

            echo "Report:"
            ls -lh snyk-container-report.json

          else

            echo "ERROR: Snyk JSON report was not generated."

          fi

          echo ""
          echo "======================================================================"


      # ========================================================
      # 14. GENERATE HUMAN READABLE REPORT
      #
      # This converts the Snyk JSON into a client-friendly report.
      # ========================================================
      - name: Generate Detailed Vulnerability Report
        if: always()
        shell: bash
        run: |

          python3 <<'PY'

          import json
          import html
          from datetime import datetime

          INPUT = "snyk-container-report.json"
          TXT = "snyk-container-report.txt"
          HTML = "snyk-container-report.html"

          try:

              with open(INPUT, "r") as f:
                  data = json.load(f)

          except Exception as e:

              error = f"Unable to read Snyk report: {e}"

              with open(TXT, "w") as f:
                  f.write(error)

              with open(HTML, "w") as f:
                  f.write(
                      "<html><body>"
                      "<h1>Snyk Container Security Report</h1>"
                      f"<p>{html.escape(error)}</p>"
                      "</body></html>"
                  )

              raise SystemExit(0)


          vulnerabilities = data.get("vulnerabilities", [])

          counts = {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
              "unknown": 0
          }


          for vuln in vulnerabilities:

              severity = str(
                  vuln.get("severity", "unknown")
              ).lower()

              if severity in counts:
                  counts[severity] += 1
              else:
                  counts["unknown"] += 1


          image_name = "${{ inputs.image_uri }}"
          threshold = "${{ inputs.severity_threshold }}"
          scan_time = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")


          severity_rank = {
              "low": 1,
              "medium": 2,
              "high": 3,
              "critical": 4
          }

          threshold_rank = severity_rank.get(
              threshold.lower(),
              3
          )


          blocking = []

          for vuln in vulnerabilities:

              severity = str(
                  vuln.get("severity", "unknown")
              ).lower()

              if severity in severity_rank:

                  if severity_rank[severity] >= threshold_rank:
                      blocking.append(vuln)


          if blocking:
              security_result = "FAIL"
          else:
              security_result = "PASS"


          # ======================================================
          # TEXT REPORT
          # ======================================================

          with open(TXT, "w") as out:

              out.write("=" * 90 + "\n")
              out.write("                 SNYK CONTAINER SECURITY REPORT\n")
              out.write("=" * 90 + "\n\n")

              out.write("SCAN INFORMATION\n")
              out.write("-" * 90 + "\n")
              out.write(f"Scanner              : Snyk Container\n")
              out.write(f"Image                : {image_name}\n")
              out.write(f"Scan Time            : {scan_time}\n")
              out.write(f"Severity Gate        : {threshold.upper()}\n")
              out.write(f"Total Vulnerabilities: {len(vulnerabilities)}\n")
              out.write(f"Security Result      : {security_result}\n")
              out.write("\n")

              out.write("VULNERABILITY SUMMARY\n")
              out.write("-" * 90 + "\n")
              out.write(f"Critical : {counts['critical']}\n")
              out.write(f"High     : {counts['high']}\n")
              out.write(f"Medium   : {counts['medium']}\n")
              out.write(f"Low      : {counts['low']}\n")
              out.write(f"Unknown  : {counts['unknown']}\n")
              out.write("\n")

              out.write("VULNERABILITY DETAILS\n")
              out.write("-" * 90 + "\n\n")


              if not vulnerabilities:

                  out.write("No vulnerabilities were reported by Snyk.\n\n")


              for index, vuln in enumerate(vulnerabilities, 1):

                  severity = str(
                      vuln.get("severity", "unknown")
                  ).upper()

                  vuln_id = vuln.get("id", "N/A")
                  title = vuln.get("title", "N/A")
                  package = vuln.get("packageName", "N/A")
                  version = vuln.get("version", "N/A")
                  fixed = vuln.get("fixedIn", "N/A")

                  cvss = (
                      vuln.get("CVSSv3")
                      or vuln.get("CVSSv4")
                      or vuln.get("cvssScore")
                      or "N/A"
                  )

                  out.write(f"[{index}] {severity}\n")
                  out.write(f"    Vulnerability ID : {vuln_id}\n")
                  out.write(f"    Title             : {title}\n")
                  out.write(f"    Package           : {package}\n")
                  out.write(f"    Installed Version : {version}\n")
                  out.write(f"    Fixed Version     : {fixed}\n")
                  out.write(f"    CVSS              : {cvss}\n")

                  if vuln.get("isUpgradable") is not None:
                      out.write(
                          f"    Upgradable        : "
                          f"{vuln.get('isUpgradable')}\n"
                      )

                  if vuln.get("isPatchable") is not None:
                      out.write(
                          f"    Patchable         : "
                          f"{vuln.get('isPatchable')}\n"
                      )

                  if severity_rank.get(severity.lower(), 0) >= threshold_rank:
                      out.write(
                          "    Security Gate      : BLOCKING\n"
                      )
                  else:
                      out.write(
                          "    Security Gate      : INFORMATIONAL\n"
                      )

                  out.write("\n")
                  out.write("-" * 90 + "\n\n")


              out.write("SECURITY GATE DECISION\n")
              out.write("-" * 90 + "\n\n")

              if security_result == "PASS":

                  out.write(
                      f"PASS - No vulnerabilities at or above "
                      f"{threshold.upper()} were found.\n"
                  )

                  out.write(
                      "\nThe image passed the configured security policy.\n"
                  )

              else:

                  out.write(
                      f"FAIL - Vulnerabilities at or above "
                      f"{threshold.upper()} were found.\n"
                  )

                  out.write(
                      "\nThe image must NOT be promoted.\n"
                  )

                  out.write(
                      "The image must NOT be signed.\n"
                  )

                  out.write(
                      "The image must NOT proceed to deployment.\n"
                  )

              out.write("\n")
              out.write("=" * 90 + "\n")


          # ======================================================
          # HTML REPORT
          # ======================================================

          def esc(value):
              return html.escape(str(value))


          rows = []

          for index, vuln in enumerate(vulnerabilities, 1):

              severity = str(
                  vuln.get("severity", "unknown")
              ).upper()

              vuln_id = vuln.get("id", "N/A")
              title = vuln.get("title", "N/A")
              package = vuln.get("packageName", "N/A")
              version = vuln.get("version", "N/A")
              fixed = vuln.get("fixedIn", "N/A")

              cvss = (
                  vuln.get("CVSSv3")
                  or vuln.get("CVSSv4")
                  or vuln.get("cvssScore")
                  or "N/A"
              )

              if severity.lower() in severity_rank and \
                 severity_rank[severity.lower()] >= threshold_rank:
                  gate = "BLOCKING"
              else:
                  gate = "INFORMATIONAL"

              rows.append(f"""
              <tr>
                <td>{index}</td>
                <td><strong>{esc(severity)}</strong></td>
                <td>{esc(vuln_id)}</td>
                <td>{esc(title)}</td>
                <td>{esc(package)}</td>
                <td>{esc(version)}</td>
                <td>{esc(fixed)}</td>
                <td>{esc(cvss)}</td>
                <td>{esc(gate)}</td>
              </tr>
              """)


          result_color = "#b91c1c" if security_result == "FAIL" else "#15803d"


          html_report = f"""
          <!DOCTYPE html>
          <html>
          <head>

          <meta charset="UTF-8">

          <title>Snyk Container Security Report</title>

          <style>

          body {{
              font-family: Arial, sans-serif;
              margin: 40px;
              background: #f7f7f7;
              color: #222;
          }}

          .header {{
              background: #111827;
              color: white;
              padding: 25px;
              border-radius: 8px;
          }}

          .result {{
              margin-top: 20px;
              padding: 20px;
              background: {result_color};
              color: white;
              font-size: 24px;
              font-weight: bold;
              border-radius: 8px;
          }}

          .section {{
              margin-top: 30px;
              background: white;
              padding: 20px;
              border-radius: 8px;
          }}

          table {{
              border-collapse: collapse;
              width: 100%;
              background: white;
          }}

          th, td {{
              border: 1px solid #ddd;
              padding: 8px;
              text-align: left;
              font-size: 13px;
          }}

          th {{
              background: #e5e7eb;
          }}

          .critical {{
              font-weight: bold;
          }}

          </style>

          </head>

          <body>

          <div class="header">

          <h1>Snyk Container Security Report</h1>

          <p><strong>Scanner:</strong> Snyk Container</p>

          <p><strong>Image:</strong> {esc(image_name)}</p>

          <p><strong>Scan Time:</strong> {esc(scan_time)}</p>

          <p><strong>Severity Gate:</strong> {esc(threshold.upper())}</p>

          </div>

          <div class="result">

          Security Result: {esc(security_result)}

          </div>

          <div class="section">

          <h2>Vulnerability Summary</h2>

          <table>

          <tr>
              <th>Severity</th>
              <th>Count</th>
          </tr>

          <tr>
              <td>Critical</td>
              <td>{counts['critical']}</td>
          </tr>

          <tr>
              <td>High</td>
              <td>{counts['high']}</td>
          </tr>

          <tr>
              <td>Medium</td>
              <td>{counts['medium']}</td>
          </tr>

          <tr>
              <td>Low</td>
              <td>{counts['low']}</td>
          </tr>

          <tr>
              <td>Unknown</td>
              <td>{counts['unknown']}</td>
          </tr>

          </table>

          </div>

          <div class="section">

          <h2>Vulnerability Details</h2>

          <table>

          <tr>
              <th>#</th>
              <th>Severity</th>
              <th>Vulnerability ID</th>
              <th>Title</th>
              <th>Package</th>
              <th>Installed</th>
              <th>Fixed In</th>
              <th>CVSS</th>
              <th>Gate</th>
          </tr>

          {''.join(rows)}

          </table>

          </div>

          <div class="section">

          <h2>Security Decision</h2>

          <p>
          """

          if security_result == "PASS":

              html_report += f"""
              <strong>PASS</strong>
              - No vulnerabilities at or above
              {esc(threshold.upper())} were detected.
              """

          else:

              html_report += f"""
              <strong>FAIL</strong>
              - Vulnerabilities at or above
              {esc(threshold.upper())} were detected.
              <br><br>
              The image must not be promoted, signed, or deployed.
              """

          html_report += """

          </p>

          </div>

          </body>
          </html>
          """


          with open(HTML, "w") as f:
              f.write(html_report)


          print("============================================================")
          print("Detailed reports generated")
          print("============================================================")
          print(f"Text report : {TXT}")
          print(f"HTML report : {HTML}")
          print(f"JSON report : {INPUT}")
          print("============================================================")

          PY


      # ========================================================
      # 15. DISPLAY DETAILED FINDINGS IN ACTIONS LOG
      # ========================================================
      - name: Display Detailed Vulnerability Findings
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================================================"
          echo "                  SNYK VULNERABILITY FINDINGS"
          echo "======================================================================"
          echo ""

          if [ -f "snyk-container-report.txt" ]; then
            cat snyk-container-report.txt
          else
            echo "Detailed Snyk report was not generated."
          fi

          echo ""
          echo "======================================================================"


      # ========================================================
      # 16. PUBLISH GITHUB ACTIONS SUMMARY
      # ========================================================
      - name: Publish GitHub Actions Security Summary
        if: always()
        shell: bash
        run: |

          echo "# Snyk Container Security Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Scan Details" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scanner | Snyk Container |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`$IMAGE_URI\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Registry | \`$ECR_REGISTRY\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`$ECR_REPOSITORY\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`$IMAGE_TAG\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity Gate | ${{ inputs.severity_threshold }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snyk Exit Code | $SNYK_EXIT_CODE |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SNYK_EXIT_CODE" -eq 0 ]; then
            echo "## Snyk Scan Result" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Snyk did not identify vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Snyk Scan Result" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Snyk identified vulnerabilities. See the detailed report artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f "snyk-container-report.txt" ]; then

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Detailed Findings" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat snyk-container-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

          fi


      # ========================================================
      # 17. UPLOAD ALL REPORTS
      # ========================================================
      - name: Upload Snyk Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-security-reports
          path: |
            snyk-container-report.json
            snyk-container-report.txt
            snyk-container-report.html
          if-no-files-found: warn
          retention-days: 30


      # ========================================================
      # 18. SECURITY GATE
      #
      # IMPORTANT:
      #
      # We scanned ALL vulnerabilities.
      #
      # Now we enforce the user-selected threshold.
      #
      # If the threshold is HIGH:
      #
      # Critical -> FAIL
      # High     -> FAIL
      # Medium   -> PASS
      # Low      -> PASS
      # ========================================================
      - name: Enforce Security Gate
        if: always()
        shell: bash
        run: |

          echo ""
          echo "======================================================================"
          echo "                       SECURITY GATE"
          echo "======================================================================"
          echo ""

          echo "Scanner            : Snyk Container"
          echo "Image              : $IMAGE_URI"
          echo "Severity Threshold : ${{ inputs.severity_threshold }}"
          echo "Snyk Exit Code     : $SNYK_EXIT_CODE"
          echo ""

          if [ ! -f "snyk-container-report.json" ]; then

            echo "ERROR: Snyk report is missing."
            echo "SECURITY GATE: FAIL"

            exit 1

          fi


          python3 <<'PY'

          import json
          import os
          import sys

          report_file = "snyk-container-report.json"

          threshold = os.environ.get(
              "INPUT_SEVERITY_THRESHOLD",
              "${{ inputs.severity_threshold }}"
          ).lower()

          ranks = {
              "low": 1,
              "medium": 2,
              "high": 3,
              "critical": 4
          }

          threshold_rank = ranks.get(threshold, 3)

          with open(report_file, "r") as f:
              data = json.load(f)

          vulnerabilities = data.get("vulnerabilities", [])

          blocking = []

          for vuln in vulnerabilities:

              severity = str(
                  vuln.get("severity", "unknown")
              ).lower()

              if severity in ranks:

                  if ranks[severity] >= threshold_rank:
                      blocking.append(vuln)


          print("")
          print("Security Policy")
          print("----------------------------")
          print(f"Threshold : {threshold.upper()}")
          print(
              f"Total vulnerabilities : "
              f"{len(vulnerabilities)}"
          )
          print(
              f"Blocking vulnerabilities : "
              f"{len(blocking)}"
          )
          print("")


          if blocking:

              print("SECURITY GATE: FAIL")
              print("")
              print(
                  f"{len(blocking)} vulnerability/vulnerabilities "
                  f"are at or above {threshold.upper()}."
              )
              print("")
              print("Image must NOT be:")
              print("  - Signed")
              print("  - Promoted")
              print("  - Deployed")
              print("")

              sys.exit(1)

          else:

              print("SECURITY GATE: PASS")
              print("")
              print(
                  f"No vulnerabilities at or above "
                  f"{threshold.upper()} were found."
              )
              print("")

              sys.exit(0)

          PY
