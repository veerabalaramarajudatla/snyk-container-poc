
name: Snyk UI Portal - Container Vulnerability Scan - Clinet

on:
  workflow_dispatch:
    inputs:
      image_uri:
        description: "Full ECR image URI including tag"
        required: true
        type: string
      aws_region:
        description: "AWS region containing the ECR image"
        required: true
        default: "ap-south-1"
        type: string

permissions:
  contents: read

jobs:
  snyk-container-scan:
    name: Scan ECR Image and Publish to Snyk UI
    runs-on: ubuntu-latest

    env:
      SNYK_PROJECT_NAME: smart-patient-bajajhealthcare-opd-backend-Container

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate Image URI
        shell: bash
        env:
          INPUT_IMAGE_URI: ${{ inputs.image_uri }}
          INPUT_AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail

          if [[ "$INPUT_IMAGE_URI" != *.dkr.ecr."$INPUT_AWS_REGION".amazonaws.com/*:* ]]; then
            echo "ERROR: Provide a valid ECR image URI including its tag."
            exit 1
          fi

          REGISTRY="${INPUT_IMAGE_URI%%/*}"
          IMAGE_PATH="${INPUT_IMAGE_URI#*/}"
          REPOSITORY="${IMAGE_PATH%:*}"
          IMAGE_TAG="${IMAGE_PATH##*:}"

          if [[ -z "$REPOSITORY" || -z "$IMAGE_TAG" ]]; then
            echo "ERROR: ECR repository or image tag is missing."
            exit 1
          fi

          echo "IMAGE_URI=$INPUT_IMAGE_URI" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "SNYK_TARGET_REFERENCE=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Snyk project name: $SNYK_PROJECT_NAME"
          echo "Image target: $REGISTRY/$REPOSITORY"
          echo "Image reference: $IMAGE_TAG"

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Image Exists
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "${{ inputs.aws_region }}"

      - name: Pull ECR Image
        run: docker pull "$IMAGE_URI"

      - name: Install Snyk CLI
        run: |
          npm install --global snyk
          snyk --version

      - name: Verify Snyk Token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            echo "ERROR: Configure the SNYK_TOKEN repository secret."
            exit 1
          fi
          echo "Snyk token is configured."

      - name: Scan Container Vulnerabilities
        id: snyk_test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e

          snyk container test "$IMAGE_URI" \
            --project-name="$SNYK_PROJECT_NAME" \
            --json-file-output=snyk-container-report.json

          RESULT=$?
          set -e

          echo "SNYK_TEST_EXIT_CODE=$RESULT" >> "$GITHUB_ENV"
          echo "Snyk scan exit code: $RESULT"

      - name: Publish Container Results to Snyk UI
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container monitor "$IMAGE_URI" \
            --project-name="$SNYK_PROJECT_NAME" \
            --target-reference="$SNYK_TARGET_REFERENCE"

      - name: Generate HTML Report
        if: always()
        run: |
          if [[ -s snyk-container-report.json ]]; then
            npm install --global snyk-to-html
            snyk-to-html \
              -i snyk-container-report.json \
              -o snyk-container-report.html
          else
            echo "Snyk JSON report was not generated." \
              > snyk-container-report-generation-error.txt
          fi

      - name: Upload Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-container-vulnerability-report
          path: |
            snyk-container-report.json
            snyk-container-report.html
            snyk-container-report-generation-error.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Scan Summary
        if: always()
        run: |
          {
            echo "### Snyk Container Scan Summary"
            echo "- Project: $SNYK_PROJECT_NAME"
            echo "- Image: $IMAGE_URI"
            echo "- Reference: $SNYK_TARGET_REFERENCE"
            echo "- Scan exit code: ${SNYK_TEST_EXIT_CODE:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
